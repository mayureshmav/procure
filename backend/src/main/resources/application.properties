server.port=8082
spring.application.name=p2p-procurement

# ── Database (default: H2 for local dev) ──────────────────────────────────────
# To switch to PostgreSQL set env vars: SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=jdbc:h2:file:./data/procurementdb;AUTO_SERVER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── File Upload (catalog import) ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:p2p-procurement-secret-key-change-in-production-min-32chars}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ── Actuator ─────────────────────────────────────────────────────────────────
# Mail health check reports DOWN when no password is set; exclude it so the
# overall health status stays UP during local/demo runs.
management.health.mail.enabled=false

# ── Mail (for import notifications) ──────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@p2p.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Catalog Import ────────────────────────────────────────────────────────────
catalog.import.temp-dir=${TEMP_DIR:/tmp/catalog-imports}
catalog.import.max-retry-attempts=3

# ── SFTP polling ─────────────────────────────────────────────────────────────
catalog.sftp.poll-interval-ms=300000
catalog.sftp.connection-timeout=30000

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8082}

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── OCR Feed Service ──────────────────────────────────────────────────────────
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8081/api}

# ── Tax Engine Integration ────────────────────────────────────────────────────
# URL of the Tax Engine service (port 8080 locally; use service name in Docker)
taxengine.url=${TAXENGINE_URL:http://localhost:8080}
# Service-account JWT — generate via POST /api/v1/auth/token on the Tax Engine
taxengine.service-token=${TAXENGINE_SERVICE_TOKEN:}
# Default jurisdictions for PO tax calculation (ISO 3166-1 alpha-2)
taxengine.default-supplier-country=${TAXENGINE_SUPPLIER_COUNTRY:US}
taxengine.default-buyer-country=${TAXENGINE_BUYER_COUNTRY:US}
